name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm --filter './packages/**' build
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: DirectDrop v__VERSION__
          releaseBody: |
            ## What's New
            - Single-viewport desktop layout that fits the supported 600x620 minimum window without page scrolling
            - Active-share list showing the share link, every file, file sizes, total size, downloads and remaining time
            - Shares now disappear immediately at expiration while DirectDrop cleans up the connection and metadata
            - Modern, calm interface inspired by Apple and Toss design principles
            - Direct WebRTC P2P file transfer with no cloud file storage
            - Temporary links, QR sharing, download limits, expiration and password protection
            - Responsive browser receiver and Windows/macOS desktop apps

            ## Known Issues
            - This release is unsigned and not notarized. Windows SmartScreen or macOS Gatekeeper may warn.
            - Some NAT/firewall combinations require an optional TURN server.

            ## Downloads
            Choose the installer for your OS and verify it with SHA256SUMS.txt.
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: DirectDrop-v[version]-[platform]-[arch][setup][ext]
          args: ${{ matrix.args }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir release-assets --pattern "DirectDrop-*"
      - name: Create SHA256SUMS
        working-directory: release-assets
        run: find . -maxdepth 1 -type f ! -name "*.sig" ! -name "SHA256SUMS.txt" -printf "%f\n" | sort | xargs sha256sum > SHA256SUMS.txt
      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" release-assets/SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
