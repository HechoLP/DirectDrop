name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            asset_name: macOS-Apple-Silicon-arm64
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            asset_name: macOS-Intel-x64
            args: --target x86_64-apple-darwin --bundles dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: Windows-x64
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm --filter './packages/**' build
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: DirectDrop v__VERSION__
          releaseBody: |
            ## What's New
            - Separate Upload and Share List views for predictable navigation
            - Start a new upload without losing the current active link until new files are chosen
            - View the active link, every uploaded file, file sizes, total size, downloads and remaining time
            - Clear Apple Silicon and Intel macOS installer names
            - Direct WebRTC P2P file transfer with no cloud file storage
            - Temporary links, QR sharing, download limits, expiration and password protection
            - Responsive browser receiver and Windows/macOS desktop apps

            ## macOS에서 처음 실행할 때
            이 릴리스는 아직 Apple 공증 전입니다. `Applications` 폴더에 DirectDrop을 복사하고, 릴리스의 `SHA256SUMS.txt`로 파일을 확인한 뒤 터미널에서 아래 명령을 실행하세요.

            ```bash
            xattr -dr com.apple.quarantine /Applications/DirectDrop.app
            open /Applications/DirectDrop.app
            ```

            ## Known Issues
            - The macOS app uses ad-hoc signing and is not Apple-notarized yet. Run the commands above if Gatekeeper blocks it.
            - The Windows app is unsigned, so SmartScreen may warn.
            - Some NAT/firewall combinations require an optional TURN server.

            ## Downloads
            - Apple Silicon Mac (M1/M2/M3/M4/M5): `macOS-Apple-Silicon-arm64.dmg`
            - Intel Mac: `macOS-Intel-x64.dmg`
            - Windows 64-bit: `Windows-x64`

            Choose the installer for your OS and verify it with `SHA256SUMS.txt`.
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: DirectDrop-v[version]-${{ matrix.asset_name }}[setup][ext]
          args: ${{ matrix.args }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir release-assets --pattern "DirectDrop-*"
      - name: Create SHA256SUMS
        working-directory: release-assets
        run: find . -maxdepth 1 -type f ! -name "*.sig" ! -name "SHA256SUMS.txt" -printf "%f\n" | sort | xargs sha256sum > SHA256SUMS.txt
      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" release-assets/SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
