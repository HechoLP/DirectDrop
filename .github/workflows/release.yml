name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            asset_name: macOS-Apple-Silicon-arm64
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            asset_name: macOS-Intel-x64
            args: --target x86_64-apple-darwin --bundles dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: Windows-x64
            args: --target x86_64-pc-windows-msvc --bundles nsis,msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm --filter './packages/**' build
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: DirectDrop v__VERSION__
          releaseBody: |
            ## 주요 변경 사항 · What's New
            - Nearby: 같은 Wi-Fi/Ethernet의 DirectDrop 기기를 mDNS로 자동 검색
            - 6자리 상호 확인 페어링, 인증서 고정 TLS, 장치별 영구 신뢰 관계
            - 외부 서버를 거치지 않는 다중 파일·폴더 LAN 스트리밍
            - 수신 전 승인, SHA-256 청크 무결성, bounded backpressure
            - 일시정지·이어보내기·취소, 연결 복구 후 검증된 offset부터 재개
            - 전송 속도·ETA·내역·받은 파일, 신뢰 기기와 자동 수신 설정
            - Share Link의 WebRTC, QR, 만료, 다운로드 제한, 비밀번호 기능 유지

            Nearby discovers DirectDrop devices on the same LAN, pairs them with a mutual six-digit check, and transfers files and folders over certificate-pinned TLS. Transfers never pass through DirectDrop or Cloudflare servers.

            ## macOS에서 처음 실행할 때
            이 릴리스는 아직 Apple 공증 전입니다. `Applications` 폴더에 DirectDrop을 복사하고, 릴리스의 `SHA256SUMS.txt`로 파일을 확인한 뒤 터미널에서 아래 명령을 실행하세요.

            ```bash
            xattr -dr com.apple.quarantine /Applications/DirectDrop.app
            open /Applications/DirectDrop.app
            ```

            ## Known Issues
            - 요청에 따라 이 릴리스는 Apple Developer ID 서명·공증을 제외했습니다. macOS 앱은 ad-hoc signing 상태이므로 Gatekeeper가 차단하면 위 명령을 사용하세요.
            - The Windows app is unsigned, so SmartScreen may warn.
            - Nearby를 처음 켤 때 macOS의 로컬 네트워크 권한 또는 Windows의 Private network 방화벽 허용이 필요할 수 있습니다.
            - Share Link는 일부 NAT/firewall 조합에서 선택적 TURN 서버가 필요할 수 있습니다.

            ## Downloads
            - Apple Silicon Mac (M1/M2/M3/M4/M5): `macOS-Apple-Silicon-arm64.dmg`
            - Intel Mac: `macOS-Intel-x64.dmg`
            - Windows 64-bit: `Windows-x64`

            Choose the installer for your OS and verify it with `SHA256SUMS.txt`.
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: DirectDrop-v[version]-${{ matrix.asset_name }}[setup][ext]
          args: ${{ matrix.args }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir release-assets --pattern "DirectDrop-*"
      - name: Create SHA256SUMS
        working-directory: release-assets
        run: find . -maxdepth 1 -type f ! -name "*.sig" ! -name "SHA256SUMS.txt" -printf "%f\n" | sort | xargs sha256sum > SHA256SUMS.txt
      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" release-assets/SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
