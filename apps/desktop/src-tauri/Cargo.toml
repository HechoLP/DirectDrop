[package]
name = "directdrop"
version = "0.1.1"
description = "Direct P2P file sharing with no cloud file storage"
authors = ["DirectDrop contributors"]
license = "MIT"
repository = "https://github.com/HechoLP/directdrop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "directdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
thiserror = "2"
